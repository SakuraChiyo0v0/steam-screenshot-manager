# electron-builder 配置（Windows x64 为首版目标平台）
#
# 工程基础阶段的出口要求：打包产物必须能启动，且数据库读写与开发运行一致。
#
# electronDist：直接使用 node_modules/electron/dist 里已解压的 Electron，而不是每次
# 重新解压下载的压缩包。原因有两个：
#   1) 本机同时装有 Windows Defender 与 ESET，刚解压出的大量文件会被扫描并短暂占用句柄，
#      导致 electron-builder 把解压目录改名的步骤间歇性报 EPERM；
#   2) 省掉一次解压，打包更快，也不依赖网络。
# 前置条件：必须先执行 pnpm install（它会解压出 node_modules/electron/dist）。
#
# 应用运行时依赖为 0（SQLite 使用 Electron 内置的 node:sqlite），
# 因此产物只需要 out/ 构建结果与 package.json。

appId: com.sakurachiyo.steam-screenshot-manager
productName: Steam截图管理器
copyright: Copyright © 2026 SakuraChiyo0v0

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# 托盘图标不进 asar：运行时用 process.resourcesPath 读取
extraResources:
  - from: resources/tray.png
    to: tray.png

asar: true

electronDist: node_modules/electron/dist

win:
  icon: resources/icon.png
  target:
    - nsis
    - portable

nsis:
  # 两个目标都产出 .exe，必须用不同文件名，否则会互相覆盖。
  artifactName: steam-screenshot-manager-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Steam截图管理器
  # 自动更新拉起安装器时（带 --updated）跳过「为谁安装」那一页：那一页只认
  # /allusers、/currentuser，electron-updater 不传，不跳会停在那儿等人点（见 resources/installer.nsh）
  include: resources/installer.nsh

portable:
  artifactName: steam-screenshot-manager-${version}-${arch}-portable.${ext}

# 自动更新的来源：GitHub Releases（仓库公开，客户端不用 token）。
# 打包时写进 resources/app-update.yml；发布由 .github/workflows/release.yml 推 v* 标签触发。
# 本机 pnpm package 只出包、不上传（electron-builder 只在 CI 的 tag 构建里 --publish）。
publish:
  provider: github
  owner: SakuraChiyo0v0
  repo: steam-screenshot-manager
  releaseType: release

# Release 正文：发布脚本从 CHANGELOG.md 抽出当前版本那一节写到这里
releaseInfo:
  releaseNotesFile: release/release-notes.md
